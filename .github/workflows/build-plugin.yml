name: Build plugin ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Validate plugin files
        run: |
          php -l src/AdminControllPlugin.php
          php -l src/Filament/Admin/Pages/Controll.php
          jq empty plugin.json
      - name: Build plugin archive
        run: |
          mkdir -p package/admin-controll
          cp plugin.json LICENSE package/admin-controll/
          cp -R src resources package/admin-controll/
          cd package
          zip -r ../ADMIN-Controll.zip admin-controll
      - name: Commit plugin archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ADMIN-Controll.zip
          git diff --cached --quiet || git commit -m "Build ADMIN Controll plugin ZIP"
          git push