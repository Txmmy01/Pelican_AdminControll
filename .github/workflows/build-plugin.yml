name: Build plugin ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin archive
        run: zip -r ADMIN-Controll.zip plugin.json src resources
      - name: Commit plugin archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ADMIN-Controll.zip
          git diff --cached --quiet || git commit -m "Build ADMIN Controll plugin ZIP"
          git push